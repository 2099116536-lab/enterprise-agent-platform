services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      # 有 key 就自动走模型，没有就走离线兜底
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      REDIS_URL: redis://redis:6379/0
    depends_on: [redis]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
